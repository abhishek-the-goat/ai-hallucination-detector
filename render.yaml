# Render deployment configuration (Free Tier):
# - Fits within Render's 512 MB RAM budget using lightweight ONNX models (no PyTorch).
# - Free tier service sleeps after 15 minutes of inactivity (initial cold start is slow).
# - SQLite history resets on redeploy (ephemeral filesystem).
# - Exactly one gunicorn worker is configured to keep memory usage minimal.

services:
  - type: web
    name: ai-hallucination-detector
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt && python scripts/download_models.py
    startCommand: gunicorn --workers 1 --threads 4 --timeout 180 --bind 0.0.0.0:$PORT dashboard.app:app
    healthCheckPath: /api/health
