# Known limits for free tier Render deployment:
# 1. Free Render has 512 MB RAM and may run out of memory loading DeBERTa (exit 137)
#    - if that happens the fix is a bigger Render plan, not code.
# 2. The free service sleeps after 15 minutes idle so the first request after idle is slow.
# 3. SQLite history resets on redeploy.
# Note: Exactly one gunicorn worker is configured because each worker loads its own copy of the models.

services:
  - type: web
    name: ai-hallucination-detector
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 4 --timeout 180 dashboard.app:app
    healthCheckPath: /api/health

